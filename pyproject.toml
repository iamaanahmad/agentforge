[project]
name = "agent4good"
version = "0.1.0"
description = "A self-hosted AI growth and product operator with durable work and human controls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "jsonschema>=4.23,<5",
    "cryptography>=46,<47",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
]
[project.scripts]
a4g = "agent4good.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent4good"]
