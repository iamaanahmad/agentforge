name: Distributed infrastructure
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: a4g
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: a4g_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U a4g -d a4g_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --group dev
      - name: Start real object storage
        run: |
          docker build -f deploy/object-storage/minio.Dockerfile -t agentforge-minio:ci .
          docker run -d --name objects -p 59000:9000 \
            -e MINIO_ROOT_USER=test-only-access \
            -e MINIO_ROOT_PASSWORD=test-only-secret-never-production \
            agentforge-minio:ci server /data
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:59000/minio/health/live; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:59000/minio/health/live
      - name: Claims, crash recovery, migration, objects, and restoration
        env:
          A4G_TEST_DATABASE_URL: postgresql://a4g:ci-only-password@127.0.0.1:5432/a4g_test
        run: uv run pytest tests/test_infrastructure.py tests/test_infrastructure_config.py -q --junitxml=infrastructure-results.xml
      - name: Require real infrastructure evidence without skips
        run: uv run python scripts/check_test_evidence.py infrastructure-results.xml --require test_real_worker_process_kill_recovery_and_drain --require test_real_object_backup_restore_and_corruption
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-acceptance
          path: infrastructure-results.xml
      - if: always()
        run: docker rm -f objects
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate test secret mounts
        run: |
          python3 scripts/bootstrap_distributed.py
          sudo chown -R 10001:10001 .infra-secrets/keys
      - name: Start control, database queue, storage, and two workers
        run: docker compose -f compose.distributed.yaml up -d --build --scale worker=2 --wait --wait-timeout 180
      - name: Verify secrets, health, and shared state
        run: |
          curl --fail http://localhost:18000/healthz
          docker compose -f compose.distributed.yaml exec -T control python scripts/infrastructure.py status
          docker compose -f compose.distributed.yaml exec -T control python - <<'PY'
          import httpx
          from agent4good.config import Settings
          from agent4good.db import Database
          from agent4good.artifacts import save_artifact, read_artifact
          settings=Settings()
          db=Database.from_settings(settings)
          assert db.metrics()['workers_online']==2
          with httpx.Client(base_url='http://localhost:8000') as client:
              response=client.post('/api/login',json={'password':settings.admin_password})
              assert response.status_code==200
              assert client.get('/api/readiness').json()['credential_storage']=='encrypted-vault'
          task=db.create_task('Tagged infrastructure test','No provider call','strategist')
          save_artifact(db,settings,'artifact-stack',task,'proof.txt','Container storage test')
          assert read_artifact(db,settings,db.one("SELECT * FROM artifacts WHERE id='artifact-stack'"))=='Container storage test'
          db.execute("UPDATE tasks SET status='cancelled' WHERE id=?",(task,))
          print('Two workers, owner login, encrypted vault, and real object storage passed')
          PY
      - name: Check database backup restoration
        run: |
          docker compose -f compose.distributed.yaml stop worker control
          docker compose -f compose.distributed.yaml exec -T postgres pg_dump -U agent4good -d agent4good -Fc > /tmp/backup.dump
          docker compose -f compose.distributed.yaml exec -T postgres createdb -U agent4good restore_test
          docker compose -f compose.distributed.yaml exec -T postgres pg_restore -U agent4good -d restore_test < /tmp/backup.dump
          docker compose -f compose.distributed.yaml exec -T postgres psql -U agent4good -d restore_test -tAc "SELECT COUNT(*) FROM artifact_objects" | grep -x '1'
      - name: Restart and verify durable volumes
        run: |
          docker compose -f compose.distributed.yaml up -d --scale worker=2 --wait --wait-timeout 120
          curl --fail http://localhost:18000/healthz
      - if: always()
        run: docker compose -f compose.distributed.yaml down -v
