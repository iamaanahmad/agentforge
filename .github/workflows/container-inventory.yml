name: Container license evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/container-inventory.yml'
      - 'scripts/container_inventory.py'
      - 'scripts/audit_go_sources.py'
      - 'deploy/object-storage/minio.Dockerfile'
      - 'deploy/object-storage/mc.Dockerfile'
      - 'tests/test_container_inventory.py'
      - 'deploy/object-storage/minio.Dockerfile'
      - 'deploy/object-storage/mc.Dockerfile'
      - 'deploy/object-storage/README.md'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: application
            dockerfile: Dockerfile
          - kind: browser
            dockerfile: browser/Dockerfile
          - kind: sandbox
            dockerfile: sandbox/Dockerfile
          - kind: minio
            dockerfile: deploy/object-storage/minio.Dockerfile
          - kind: mc
            dockerfile: deploy/object-storage/mc.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Build locally without publishing
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --platform linux/amd64 --file "$DOCKERFILE" --tag agentforge-inventory:ci .
      - name: Inspect final image without starting services
        env:
          KIND: ${{ matrix.kind }}
        run: |
          python3 scripts/container_inventory.py agentforge-inventory:ci \
            --kind "$KIND" --commit "$(git rev-parse HEAD)" --output evidence
          cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Match linked Go modules to packaged source
        if: matrix.kind == 'minio' || matrix.kind == 'mc'
        env:
          KIND: ${{ matrix.kind }}
        run: |
          container=$(docker create --network none agentforge-inventory:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/share/source/$KIND-corresponding-source.tar.gz" evidence/corresponding-source.tar.gz
          python3 scripts/audit_go_sources.py evidence/inventory.json evidence/corresponding-source.tar.gz \
            --output evidence/go-source-map.json
          python3 -c 'import json; d=json.load(open("evidence/go-source-map.json")); print("Mapped modules:",len(d["modules"])); print("Missing root notices:",len(d["missing_root_notices"]))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: container-inventory-${{ matrix.kind }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
